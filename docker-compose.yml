services:
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9621:9621"
    volumes:
      # Персистентные папки LightRAG (input + working dir)
      - ./data/lightrag/inputs:/app/data/inputs
      - ./data/lightrag/rag_storage:/app/data/rag_storage
      # Подключаем .env внутрь контейнера (как в официальном compose LightRAG)
      - ./.env:/app/.env:ro
    depends_on:
      - postgres
      - neo4j
      - qdrant
    extra_hosts:
      # Полезно, если когда-нибудь подключишь Ollama/vLLM на хосте
      - "host.docker.internal:host-gateway"

  postgres:
    container_name: lightrag-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: lightrag
    ports:
      - "5432:5432" # можно убрать, если не нужен доступ с хоста
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    container_name: lightrag-neo4j
    image: neo4j:2026.01.4
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/change_me_neo4j_password
      # Для LightRAG APOC обычно не обязателен, но можно включить позже при необходимости:
      # NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/import
      - ./data/neo4j/plugins:/plugins

  qdrant:
    container_name: lightrag-qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + Web UI dashboard
      - "6334:6334" # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
